name: CI

on:
  push:
    branches:
      - main
      - dev/codex
  pull_request:
    branches:
      - main
      - dev/codex
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Full Test Chain
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install JS dependencies
        run: npm install

      - name: Check
        run: npm run check

      - name: Build wasm packages
        run: npm run build:wasm

      - name: Install V8 via jsvu
        run: npx jsvu --os=linux64 --engines=v8

      - name: Test
        run: npm test

      - name: Upload pages runtime package
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pages-runtime-pkg
          path: |
            pkg/compiler
            pkg/executor
          if-no-files-found: error

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: npm install

      - name: Download pages runtime package
        uses: actions/download-artifact@v4
        with:
          name: pages-runtime-pkg
          path: pkg

      - name: Prepare site
        run: npm run pages:prepare

      - name: Verify site payload
        run: npm run pages:verify

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
